[project]
name = "bhopal-civicai-backend"
version = "1.0.0"
description = "FastAPI backend for Bhopal CivicAI — AI-assisted civic grievance platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends()/Query() defaults are the documented idiom
    "E501",   # long descriptive strings in OpenAPI metadata
    "UP042",  # `(str, Enum)` is deliberate: it keeps the members plain `str`
              # for SQLAlchemy's values_callable and for JSON serialisation,
              # without depending on StrEnum's differing __str__ behaviour.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]      # env must be set before app imports
"scripts/*" = ["E402"]    # sys.path bootstrap before app imports
